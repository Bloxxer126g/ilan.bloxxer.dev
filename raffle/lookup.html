<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raffle tickets: look up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>.planner-card{grid-template-columns:1fr}</style>
</head>
<body>
<div id="cursor-outer"></div>
<nav>
  <div class="logo">raffle<span>.</span></div>
  <div class="nav-right">
    <a href="index.html">Enter ticket</a>
    <a href="lookup.html" class="here">Look up</a>
  </div>
</nav>

<header class="hero">
  <div class="badge">Lookup desk</div>
  <h1>Whose <span>ticket?</span></h1>
  <p>Type a ticket number to see the name it was entered under.</p>
</header>

<main>
  <section class="planner">
    <div class="planner-card">
      <div class="card-title">Find a ticket</div>
      <div class="form-row">
        <label for="ticket">Ticket number</label>
        <input type="text" id="ticket" placeholder="e.g. 0427" autocomplete="off" inputmode="numeric">
      </div>
      <button class="btn-plan" id="go">Look up <span class="arr">→</span></button>
    </div>
  </section>

  <section class="result">
    <div class="msg" id="msg"></div>
    <div class="found" id="found">
      <div class="lab" id="lab"></div>
      <div class="big" id="who"></div>
      <div class="sub" id="when"></div>
    </div>
  </section>
</main>

<footer>Raffle desk<span class="blink">_</span></footer>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
const $=s=>document.querySelector(s);
const msg=$('#msg'),found=$('#found'),t=$('#ticket'),btn=$('#go');
async function go(){
  hide(msg);found.classList.remove('visible');
  if(!SB.configured){show(msg,'warn','Supabase is not connected yet. Open config.js and paste in your project URL and key.');return;}
  const ticket=t.value.trim();
  if(!ticket){show(msg,'err','Type a ticket number first.');return;}
  btn.disabled=true;
  try{
    const row=await SB.find(ticket);
    if(!row){show(msg,'warn','No entry found for ticket #'+ticket+'.');}
    else{
      $('#lab').textContent='Ticket #'+row.ticket+' belongs to';
      $('#who').textContent=row.name;
      $('#when').textContent='Entered '+new Date(row.created_at).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'});
      found.classList.add('visible');
    }
  }catch(e){show(msg,'err',e.message||'Could not reach Supabase.');}
  btn.disabled=false;
}
btn.addEventListener('click',go);
t.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
</script>
</body>
</html>
