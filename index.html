<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="animations.css">

<body>

<div id="cursor-outer"></div>
<div id="cursor-inner"></div>

<div id="visitor-widget">
  <div class="vc-label">VISITORS</div>
  <span id="visitor-count" class="vc-loading">...</span>
</div>

<nav>
  <span class="logo" onclick="location.href='https://ilan.bloxxer.dev?accepted=true'">ILAN<span>.BLOXXER.DEV</span>
</nav>

<main>
  <div id="FlashbangContainer"></div>
  <div class="title-block">
    <div class="eyebrow">PERSONAL PROJECTS</div>
    <h1><span class="AppearingText" id="Ap1">I</span><span class="AppearingText" id="Ap2">l</span><span class="AppearingText" id="Ap3">a</span><span class="AppearingText" id="Ap4">n</span><span class="blink" class="RedDot">.</span></h1>
    <div class="sub">Select a project below to launch it.</div>
  </div>

  <div class="projects AppearingProjects">

    <a class="project AppearingProject" href="https://ilan.bloxxer.dev/tube-route?accepted=true" title="Plan any London tube journey live">
      <span class="project-badge badge-new">NEW</span>
      <div class="project-icon">🚇</div>
      <div class="project-name">TUBE-ROUTE</div>
      <div class="project-desc">Live tube journey planner</div>
    </a>

    <a class="project AppearingProject" href="https://ilan.bloxxer.dev/rent-a-ram?accepted=true" title="A parody site about renting RAM">
      <div class="project-icon">💾</div>
      <div class="project-name">RENT-A-RAM</div>
      <div class="project-desc">RAM rental parody site</div>
    </a>

    <a class="project AppearingProject" href="https://ilan.bloxxer.dev/github?accepted=true" title="My GitHub Repositories">
      <div class="project-icon">🐙</div>
      <div class="project-name">GITHUB</div>
      <div class="project-desc">My public repositories</div>
    </a>

    <a class="project AppearingProject" href="https://bloxxer.dev" title="Exit the Ilan Zome">
      <div class="project-icon">⬅️</div>
      <div class="project-name">Back to bloxxer.dev</div>
      <div class="project-desc">Go back to the main website.</div>
    </a>

  </div>
</main>

<footer>
  ILAN.BLOXXER.DEV &nbsp;|&nbsp; <span class="blink">_</span>
</footer>

<script>
(function(){
  var o=document.getElementById('cursor-outer'),i=document.getElementById('cursor-inner');
  if(!o||!i)return;
  var mx=0,my=0,ox=0,oy=0;
  document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;i.style.left=mx+'px';i.style.top=my+'px';});
  (function a(){ox+=(mx-ox)*.12;oy+=(my-oy)*.12;o.style.left=Math.round(ox*10)/10+'px';o.style.top=Math.round(oy*10)/10+'px';requestAnimationFrame(a);})();
  document.querySelectorAll('a,.project').forEach(function(el){
    el.addEventListener('mouseenter',function(){document.body.classList.add('ch');});
    el.addEventListener('mouseleave',function(){document.body.classList.remove('ch');});
  });
})();
</script>

<script>
(function() {
  fetch("https://website-counter-bjxn.onrender.com//api/visit")
  .then(r => r.json())
  .then(d => {
    document.getElementById("visitor-count").innerText = d.visits;
  })
    .catch(function() {
      document.getElementById('visitor-count').innerText = '—';
    });
})();
</script>

<script>
  setTimeout(function() {
    document.getElementById("FlashbangContainer").remove();
  }, 3500)
</script>
</body>
</html>
