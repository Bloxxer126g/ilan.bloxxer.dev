<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raffle tickets: enter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="cursor-outer"></div>
<nav>
  <div class="logo">raffle<span>.</span></div>
  <div class="nav-right">
    <a href="index.html" class="here">Enter ticket</a>
    <a href="lookup.html" class="cta">Look up <span class="arr">→</span></a>
  </div>
</nav>

<header class="hero">
  <div class="badge">Entry desk</div>
  <h1>Log a <span>ticket.</span></h1>
  <p>Type the ticket number and the name that goes with it. It is saved straight away.</p>
</header>

<main>
  <section class="planner">
    <div class="planner-card">
      <div class="card-title">New entry</div>
      <div class="form-row">
        <label for="ticket">Ticket number</label>
        <input type="text" id="ticket" placeholder="e.g. 0427" autocomplete="off" inputmode="numeric">
      </div>
      <div class="form-row">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Full name" autocomplete="off">
      </div>
      <button class="btn-plan" id="save">Save entry <span class="arr">→</span></button>
    </div>
  </section>

  <section class="result"><div class="msg" id="msg"></div></section>

  <section class="recent" id="recentWrap" style="display:none">
    <div class="section-title">Latest entries</div>
    <div class="rows" id="rows"></div>
  </section>
</main>

<footer>Raffle desk<span class="blink">_</span></footer>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
const $=s=>document.querySelector(s);
const msg=$('#msg'),t=$('#ticket'),n=$('#name'),btn=$('#save');

async function loadRecent(){
  if(!SB.configured) return;
  const list = await SB.recent(8);
  if(!list.length) return;
  $('#recentWrap').style.display='block';
  $('#rows').innerHTML='';
  list.forEach(x=>{
    const d=document.createElement('div');d.className='row';
    const b=document.createElement('b');b.textContent='#'+x.ticket;
    const s=document.createElement('span');s.textContent=x.name;
    d.append(b,s);$('#rows').append(d);
  });
}

async function save(){
  hide(msg);
  if(!SB.configured){show(msg,'warn','Supabase is not connected yet. Open config.js and paste in your project URL and key.');return;}
  const ticket=t.value.trim(), name=n.value.trim();
  if(!ticket||!name){show(msg,'err','Please fill in both the ticket number and the name.');return;}
  btn.disabled=true;
  try{
    const r=await SB.add(ticket,name);
    if(r.ok){
      show(msg,'ok','Saved: ticket #'+ticket+' belongs to '+name+'.');
      t.value='';n.value='';t.focus();loadRecent();
    }else if(r.duplicate){
      show(msg,'warn','Ticket #'+ticket+' has already been entered. Check the number, or look it up to see who has it.');
    }else{
      show(msg,'err',r.message);
    }
  }catch(e){show(msg,'err','Could not reach Supabase. Check your internet and the values in config.js.');}
  btn.disabled=false;
}
btn.addEventListener('click',save);
[t,n].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')save();}));
t.addEventListener('keydown',e=>{if(e.key==='Enter'&&!n.value)n.focus();});
loadRecent();
</script>
</body>
</html>
